name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN (CodeQL: actions/missing-workflow-permissions).
# Every job is read-only by default; only the dedicated badge-publish job
# (gated to pushes on master) is granted contents: write. This keeps
# PR-controlled code out of any job that holds a push credential.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this job runs PR-controlled code (npm scripts, checkout) and
    # must never hold a push credential. The coverage badge it generates is
    # handed to the publish-badge job below via an artifact.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Validate publish workflow
        run: npm run validate:publish-workflow

      - name: Validate security workflow
        run: npm run validate:security-workflow

      - name: Test with coverage
        run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run e2e

      - name: Upload coverage artifact
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-coverage
          path: coverage/**
          if-no-files-found: warn

      - name: Upload coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-badge
          path: .github/badges/coverage.svg
          if-no-files-found: error

      - name: Build
        run: npm run build-prod

  # Dedicated, minimal-surface job: it runs no PR-controlled code, only
  # downloads the badge artifact produced by build and commits it. This is the
  # only job granted contents: write, and it is gated to pushes on master.
  publish-badge:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage badge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-badge
          path: .github/badges

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push || echo "Badge push skipped (protected branch or insufficient token permissions)"
