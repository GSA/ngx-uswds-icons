name: Security

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build demo runtime
        run: npm run build -- --configuration production

      - name: Serve demo runtime with production security headers
        run: node scripts/serve-security-scan.mjs &

      - name: Wait for demo runtime
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4200/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Scan runtime with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:4200'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Enforce medium/high severity gate
        run: node scripts/check-zap-severity.mjs report_json.json .zap/rules.tsv

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: report_*.html
          if-no-files-found: warn
